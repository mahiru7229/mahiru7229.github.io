<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; url=https://mcwlauncher.pages.dev/">
  <link rel="canonical" href="https://mcwlauncher.pages.dev/">
  <meta name="robots" content="noindex, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đang chuyển hướng tới MCW Launcher...</title>
  <script>
    (function() {
      var target = "https://mcwlauncher.pages.dev/";
      var hash = window.location.hash || "";
      if (hash.indexOf("download") !== -1) {
        target += "#download";
      } else if (hash.indexOf("features") !== -1) {
        target += "#features";
      } else if (hash.indexOf("workflow") !== -1) {
        target += "#comparison";
      } else if (hash) {
        target += hash;
      }
      window.location.replace(target);
    })();
  </script>
  <style>
    :root {
      --bg: #07090e;
      --card: #0f1422;
      --accent: #ff1f44;
      --accent-glow: rgba(255, 31, 68, 0.35);
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 31, 68, 0.15);
      border: 1px solid rgba(255, 31, 68, 0.35);
      color: #ff4d6d;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff1f44;
      box-shadow: 0 0 8px #ff1f44;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #ff1f44, #ff5722);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px;
      box-shadow: 0 8px 24px var(--accent-glow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 31, 68, 0.5);
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 31, 68, 0.2);
      border-top-color: #ff1f44;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <div class="badge">
      <span class="badge-dot"></span>
      Website Migration
    </div>
    <h1>Đang chuyển hướng sang trang chủ mới</h1>
    <p>MCW Launcher đã chuyển sang cổng thông tin thế hệ mới tại Cloudflare Edge CDN. Bạn sẽ được tự động chuyển hướng ngay bây giờ.</p>
    <a class="btn" href="https://mcwlauncher.pages.dev/">
      Truy cập ngay ➔
    </a>
  </div>
</body>
</html>
